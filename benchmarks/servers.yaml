# Server registry — define once, reference by name in configs.
# Usage in configs:
#   servers:
#     - mmsaki           # default version
#     - mmsaki@v0.1.20   # specific version
#     - solc

mmsaki:
  cmd: solidity-language-server
  link: https://github.com/asyncswap/solidity-language-server
  versions:
    # The pinned v0.1.17–v0.1.24 entries below resolve against a local
    # ~/.solidity-lsp install and only work on a machine that has them.
    v0.1.17:
      cmd: /Users/meek/.solidity-lsp/0.1.17/bin/solidity-language-server
    v0.1.19:
      cmd: /Users/meek/.solidity-lsp/0.1.19/bin/solidity-language-server
    v0.1.20:
      cmd: /Users/meek/.solidity-lsp/0.1.20/bin/solidity-language-server
    v0.1.21:
      cmd: /Users/meek/.solidity-lsp/0.1.21/bin/solidity-language-server
    v0.1.22:
      cmd: /Users/meek/.solidity-lsp/0.1.22/bin/solidity-language-server
    v0.1.23:
      cmd: /Users/meek/.solidity-lsp/0.1.23/bin/solidity-language-server
    v0.1.24:
      cmd: /Users/meek/.solidity-lsp/0.1.24/bin/solidity-language-server
    # Stale: this points at whatever is built in the checkout, not at v0.1.25,
    # so the commented-out A/B in pool.yaml and shop.yaml compares a build
    # against itself. Repoint it at a real v0.1.25 install or drop it.
    v0.1.25:
      cmd: ./target/release/solidity-language-server
    # Resolved relative to the repo root, so `latest` means "the build in this
    # checkout" for whoever is running the benchmark.
    latest:
      cmd: ./target/release/solidity-language-server

solc:
  cmd: solc
  args: ["--lsp"]
  link: https://docs.soliditylang.org

nomicfoundation:
  cmd: nomicfoundation-solidity-language-server
  args: ["--stdio"]
  link: https://github.com/NomicFoundation/hardhat-vscode

juanfranblanco:
  cmd: vscode-solidity-server
  args: ["--stdio"]
  link: https://github.com/juanfranblanco/vscode-solidity

qiuxiang:
  cmd: solidity-ls
  args: ["--stdio"]
  link: https://github.com/qiuxiang/solidity-ls
